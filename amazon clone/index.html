<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <header>
        <div class="header-bar y-axis">
            <div class="logo">
                <img class="amazon-logo" src="images/Amazon logo.png" alt="">
            </div>
            <div class="delivery-section">
                <p class="delivery-to">Deliver To</p>
                <div class="delivery-loc"><i class="fa-solid fa-location-dot" style="color: white;"></i>
                    <h3 class="delivery-to">Pakistan</h3>
                </div>
            </div>
            <div class="search-bar y-axis">

                <div class="select-wrapper ">
                    <select class="select-search border-none">
                        <option>All</option>
                        <option>Electronics</option>
                        <option>Books</option>
                        <option>Clothing</option>
                        <option>Home</option>
                        <option>Home</option>
                        <option>Home</option>
                        <option>Home</option>
                        <option>Home</option>
                        <option>Home</option>
                        <option>LCD</option>
                        <option>LCD</option>
                        <option>LCD</option>

                    </select>
                </div>

                <input type="text" class="search-input border-none" placeholder="Search Anything" />

                <button class="search-btn border-none">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="language-section">
                <img class="usimg" src="images/united-states.png" alt="">
                <h4 class="EN">EN</h4>
                <img class="dropdown" src="images/down-chevron.png" alt="">

                <div class="lang-dropdown">
                    <p class="title">Change language</p>

                    <label><input type="radio" name="lang" checked> English - EN</label>
                    <hr>
                    <label><input type="radio"> español - ES</label>
                    <label><input type="radio"> العربية - AR</label>
                    <label><input type="radio"> Deutsch - DE</label>
                    <label><input type="radio"> Deutsch - DE</label>
                    <label><input type="radio"> Deutsch - DE</label>
                    <label><input type="radio"> Deutsch - DE</label>
                    <hr>
                    <p class="title">Change currency</p>
                    <label><input type="radio" checked> PKR - Pakistani Rupee</label>
                    <label><input type="radio"> $ - USD - US Dollar</label>
                    <p class="seeall">See all</p>
                    <hr>
                    <p class="amazon-com"> <img class="usimg" src="images/united-states.png" alt="">You are shopping on
                        <br> Amazon.com
                    </p>
                    <p class="region">Change Country/region</p>
                </div>
            </div>
            <div class="signin-section">
                <p class="signin">Hello,signin</p>
                <div>
                    <h4 class="delivery-to">Account & Lists</h4><img class="dropdown" src="images/down-chevron.png"
                        alt="">
                </div>

                <div class="signin-dropdown">
                    <button>Signin</button>
                    <div class="newcustomer">
                        <p class="customer">New Customer?<span class="start-here">Start here</span></p>
                    </div>
                    <hr style="width: 90%;">
                </div>
            </div>

            <div></div>
        </div>
    </header>




    <script src="app.js"></script>
</body>

</html>
